<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <title>MemoFlow</title>
</head>

<body>

    
    
    <div class="overlay"></div>

    <main class="main-content">          
        <h1>MemoFlow</h1>

        <div class="app">

                <section class="sidebar">

                    <h2>Carpetas</h2>
                    
                        <button class="button button-secondary">
                            <i class="button-icon" data-lucide="folder-plus"></i>
                            Nueva Carpeta
                        </button>

                    <ul class="folder-list">
                        <li class="folder">
                            <button class="folder-button">
                                <span class="folder-name">General</span>
                                <span class="note-count">4</span>
                            </button>
                        </li>
                    </ul> 

                            

                </section>
                
                <section class="notes">

                    <header class="notes-header">
                    
                        <div class="notes-header-top">
                            
                            <button class="button menu-button" aria-label="Abrir menú de carpetas"> 
                                <i class="button-icon" data-lucide="menu"></i>
                            </button>
                            
                            <div class="search-section">                    
                                <label class="search-box">
                                    <i class="button-icon" data-lucide="search"></i>

                                    <input class="search-input"
                                    type="search"
                                    placeholder="Buscar notas..."
                                    aria-label="Buscar notas">
                                </label> 

                                <span class="notes-counter">15 notas</span>
                            </div>
                        

                            <button class="button button-primary"><i class="button-icon" data-lucide="sticky-note-plus"></i>
                                    Nueva Nota
                                </button>
                            
                        </div>   

                            

                    </header>

                    

                    <div class="notes-list">

                        <article class="note">
                            
                            <header class="note-header">                              
                                                                
                                <i class="button-icon" data-lucide="chevronDown"></i>
                                <input type="text" 
                                class="note-title"
                                placeholder="Escribí un título">

                                <button class="note-options-button"><i class="button-icon" data-lucide="ellipsis-vertical"></i>
                                </button>

                            </header>

                            <div class="note-content">

                                <textarea class="note-text" placeholder="Escribí tu nota"></textarea>

                                <footer class="note-footer">                    
                                    
                                        <time datetime="2026-12-07">
                                            07/12/2026
                                        </time>           
                                
                                </footer>

                            </div>

                        </article>

                    </div>

                </section>

        </div>
       

        <button class="delete-button">
            Papelera
        </button>

    </main>


  
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>

    <script src="script.js"></script>
</body>
</html>
